<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AUX Matrix Test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link href="styles.css" rel="stylesheet" />
    <script type="text/javascript" src="script.js"></script>

    <script type="module" src="../../../index.js"></script>
    <script type="module" src="../../../components.js"></script>

    <link rel="stylesheet" href="../../../../styles/default.css" />

    <script type="module">
      import { MatrixData, VirtualTreeDataView } from '../../models.js';

      const sort = (a, b) => {
        const la = a.id;
        const lb = b.id;
        if (la === lb) return 0;
        return la > lb ? 1 : -1;
      };
      window.matrix = new MatrixData();
      const ports = ['L', 'C', 'R', "L'", "R'", 'LF'];
      const inputs = matrix.addGroup({ label: 'Inputs', icon: 'speaker' });
      const outputs = matrix.addGroup({ label: 'Outputs', icon: 'speaker' });
      for (let i = 0; i < 100; i++) {
        const ogroup = outputs.addGroup({
          label: 'Output #' + (i + 1),
          icon: 'mc5_1',
        });
        const igroup = inputs.addGroup({
          label: 'Input #' + (i + 1),
          icon: 'mc5_1',
        });
        for (let j = 0; j < 6; j++) {
          const iport = igroup.addPort({
            label: 'Channel ' + ports[j],
            icon: 'disconnected',
          });
          const oport = ogroup.addPort({
            label: 'Channel ' + ports[j],
            icon: 'disconnected',
          });
        }
      }

      document.addEventListener('DOMContentLoaded', () => {
        const aux_matrix = document.querySelector('aux-matrix');
        aux_matrix.sources = new VirtualTreeDataView(inputs, 10, null, sort);
        aux_matrix.sinks = new VirtualTreeDataView(outputs, 10, null, sort);
        // aux_matrix.sinks = matrix.createVirtualTreeDataView(0, null, sort);
        const widget = aux_matrix.auxWidget;

        const mayConnect = (source, sink) =>
          source && sink && !source.isGroup && !sink.isGroup;

        const forEachDiagonal = (indexRectangle, cb) => {
          const sources = widget.get('sources');
          const sinks = widget.get('sinks');
          const row0 = Math.floor(indexRectangle.startRow);
          const col0 = Math.floor(indexRectangle.startColumn);
          const rows = Math.ceil(indexRectangle.endRow) - row0;
          const cols = Math.ceil(indexRectangle.endColumn) - col0;
          const n = Math.min(rows, cols);
          for (let i = 0; i < n; i++) {
            cb(sources.at(row0 + i), sinks.at(col0 + i));
          }
        };

        const forEachInRectangle = (indexRectangle, cb) => {
          const sources = widget.get('sources');
          const sinks = widget.get('sinks');
          const row0 = Math.floor(indexRectangle.startRow);
          const col0 = Math.floor(indexRectangle.startColumn);
          const row1 = Math.ceil(indexRectangle.endRow);
          const col1 = Math.ceil(indexRectangle.endColumn);
          for (let r = row0; r < row1; r++) {
            for (let c = col0; c < col1; c++) {
              cb(sources.at(r), sinks.at(c));
            }
          }
        };

        widget.on('toggleConnection', (port1, port2) => {
          console.log('wants to toggleConnection', port1, port2);
          const connection = matrix.getConnection(port1, port2);
          if (connection) {
            matrix.deleteConnection(connection);
          } else {
            matrix.connect(port1, port2);
          }
        });

        widget.on('connectDiagonal', (indexRectangle) => {
          forEachDiagonal(indexRectangle, (source, sink) => {
            if (!mayConnect(source, sink)) return;
            if (!matrix.getConnection(source, sink)) {
              matrix.connect(source, sink);
            }
          });
        });

        widget.on('disconnectDiagonal', (indexRectangle) => {
          forEachDiagonal(indexRectangle, (source, sink) => {
            if (!mayConnect(source, sink)) return;
            const connection = matrix.getConnection(source, sink);
            if (connection) matrix.deleteConnection(connection);
          });
        });

        widget.on('disconnectAll', (indexRectangle) => {
          forEachInRectangle(indexRectangle, (source, sink) => {
            if (!mayConnect(source, sink)) return;
            const connection = matrix.getConnection(source, sink);
            if (connection) matrix.deleteConnection(connection);
          });
        });
      });
    </script>
  </head>
  <body>
    <aux-root>
      <aux-matrix></aux-matrix>
    </aux-root>
  </body>
</html>
